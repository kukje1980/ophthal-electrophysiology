<meta charset="utf-8">
<title>전체사진 멀티 뷰어</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../static/css/photo-viewer.css">
<script src="../static/js/photo-viewer.js"></script>
<style>
  /* Layout: the app's gallery (date-grouped thumbnail grid + sticky selection
     bar) above the real multi viewer, all client-side with synthetic images. */
  :root {
    --bg: #f6f8fb; --card: #ffffff; --ink: #1e293b; --muted: #64748b;
    --line: #e2e8f0; --primary: #2563eb; --primary-ink: #ffffff;
    --bar: #0f172a; --bar-ink: #e2e8f0; --bar-btn: #1e293b; --bar-line: #334155;
    --tag-bg: #e0e7ff; --tag-ink: #3730a3; --note-bg: #eff6ff; --note-ink: #1e3a8a;
    --od-bg: #dbeafe; --od-ink: #1d4ed8; --os-bg: #fee2e2; --os-ink: #b91c1c;
    --font: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0f1c; --card: #111a2c; --ink: #e7eefb; --muted: #93a4bf;
      --line: #22304a; --primary: #3b82f6; --primary-ink: #ffffff;
      --bar: #060b16; --bar-ink: #e2e8f0; --bar-btn: #17223a; --bar-line: #2a3a5c;
      --tag-bg: #1e2a52; --tag-ink: #c7d2fe; --note-bg: #0f1d3a; --note-ink: #bfdbfe;
      --od-bg: #1e3a8a; --od-ink: #dbeafe; --os-bg: #7f1d1d; --os-ink: #fee2e2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0f1c; --card: #111a2c; --ink: #e7eefb; --muted: #93a4bf;
    --line: #22304a; --primary: #3b82f6; --primary-ink: #ffffff;
    --bar: #060b16; --bar-ink: #e2e8f0; --bar-btn: #17223a; --bar-line: #2a3a5c;
    --tag-bg: #1e2a52; --tag-ink: #c7d2fe; --note-bg: #0f1d3a; --note-ink: #bfdbfe;
    --od-bg: #1e3a8a; --od-ink: #dbeafe; --os-bg: #7f1d1d; --os-ink: #fee2e2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .view { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1320px; margin: 0 auto; padding-block: 18px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 12px; }
  .wrap.is-viewer { max-width: none; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 24px; margin: 0; text-wrap: balance; }
  h1 small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .note { background: var(--note-bg); color: var(--note-ink); border-radius: 10px; padding: 9px 12px;
    font-size: 13px; margin: 0; }
  .btn { display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit;
    font-size: 13px; cursor: pointer; }
  .btn:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 3px solid #93c5fd; outline-offset: 1px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink);
    font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  .back { background: none; border: 0; color: var(--primary); font: inherit; cursor: pointer; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .selbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap;
    align-items: center; gap: 8px; padding: 9px 12px; background: var(--bar); color: var(--bar-ink);
    border-radius: 10px; }
  .selbar .btn { background: var(--bar-btn); color: var(--bar-ink); border-color: var(--bar-line); }
  .selbar .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink);
    margin-left: auto; padding: 8px 18px; }
  .selbar .hint { font-size: 12px; opacity: .7; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group h2 { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; font-size: 14px; }
  .group h2 span { color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 10px; overflow: hidden;
    cursor: pointer; user-select: none; }
  .card.is-sel { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.22); }
  .img { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: #000; }
  .img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .check { position: absolute; left: 8px; top: 8px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,.35); color: transparent; display: grid;
    place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .card.is-sel .check { background: var(--primary); border-color: var(--primary); color: #fff; }
  .eye { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 700; padding: 1px 7px;
    border-radius: 6px; }
  .eye.OD { background: var(--od-bg); color: var(--od-ink); }
  .eye.OS { background: var(--os-bg); color: var(--os-ink); }
  .edited { position: absolute; left: 8px; bottom: 8px; font-size: 10px; padding: 1px 6px; border-radius: 6px;
    background: rgba(250,204,21,.92); color: #422006; font-weight: 700; }
  .cap { padding: 7px 10px 9px; font-size: 13px; }
  .tag { background: var(--tag-bg); color: var(--tag-ink); padding: 1px 7px; border-radius: 6px;
    font-size: 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  @media (max-width: 620px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .selbar .hint { display: none; }
  }
</style>

<div class="wrap" id="wrap">
  <section id="gallery-view" class="view">
    <div class="head">
      <h1>전체사진 <small>All photos</small></h1>
      <span class="muted" id="count"></span>
    </div>
    <p class="note">서버 없이 동작하는 미리보기입니다. 사진은 모두 프로그램으로 만든 <b>가상 예시 영상</b>입니다.
      사진을 눌러 고른 뒤 <b>▦ 멀티</b>를 누르면, 선택한 사진을 나란히 보면서 확대·돋보기·회전·밝기/대비·Red-free·측정·3D를 쓸 수 있습니다.</p>
    <div class="chips" role="group" aria-label="검사 종류" id="chips"></div>
    <div class="selbar">
      <b id="selcount">0장 선택</b>
      <button class="btn" type="button" id="sel-all">보이는 사진 전체 선택</button>
      <button class="btn" type="button" id="sel-none">선택 해제</button>
      <span class="hint">클릭: 선택 · Shift+클릭: 범위 · 더블클릭: 바로 보기</span>
      <button class="btn primary" type="button" id="multi" disabled>▦ 멀티</button>
    </div>
    <div id="groups"><p class="muted">예시 사진 만드는 중…</p></div>
  </section>

  <section id="viewer-view" class="view" hidden>
    <div class="head">
      <button class="back" type="button" id="back">← 전체사진</button>
      <span class="muted" id="viewer-title"></span>
    </div>
    <div id="viewer"></div>
  </section>
</div>

<script>
/* ---- synthetic ophthalmic images (no real patient data) ---------------- */
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const canvas = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });

function fundus({ eye, seed, lesions, w = 1600, h = 1200 }) {
  const c = canvas(w, h), x = c.getContext("2d"), r = rng(seed);
  const cx = w / 2, cy = h / 2, R = h * 0.47, s = eye === "OD" ? 1 : -1;
  x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
  x.save();
  x.beginPath(); x.arc(cx, cy, R, 0, 2 * Math.PI); x.clip();
  let g = x.createRadialGradient(cx, cy, R * 0.05, cx, cy, R);
  g.addColorStop(0, "#d25d28"); g.addColorStop(0.65, "#b4471d"); g.addColorStop(1, "#742811");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) {  // choroidal texture
    const a = r() * 2 * Math.PI, d = Math.sqrt(r()) * R;
    x.fillStyle = r() < 0.5 ? "rgba(255,170,120,0.07)" : "rgba(80,18,8,0.08)";
    x.fillRect(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 5, 5);
  }
  const mx = cx - s * 0.12 * R, my = cy + 0.02 * R;  // macula
  g = x.createRadialGradient(mx, my, 0, mx, my, 0.25 * R);
  g.addColorStop(0, "rgba(70,16,6,0.6)"); g.addColorStop(1, "rgba(70,16,6,0)");
  x.fillStyle = g; x.fillRect(mx - R * 0.3, my - R * 0.3, R * 0.6, R * 0.6);
  const disc = [cx + s * 0.33 * R, cy - 0.04 * R];
  x.lineCap = "round";
  for (let k = 0; k < 4; k++) {  // arcades: superior/inferior arteries + veins
    const up = k % 2 === 0;
    let px = disc[0], py = disc[1], width = k < 2 ? 15 : 10;
    let a = (eye === "OD" ? Math.PI : 0) + (up ? -1 : 1) * (0.35 + 0.1 * r());
    x.strokeStyle = k < 2 ? "rgba(115,20,16,0.95)" : "rgba(160,40,26,0.9)";
    for (let step = 0; step < 70; step++) {
      const nx = px + 14 * Math.cos(a), ny = py + 14 * Math.sin(a);
      x.lineWidth = Math.max(2, width);
      x.beginPath(); x.moveTo(px, py); x.lineTo(nx, ny); x.stroke();
      px = nx; py = ny;
      a += (up ? 0.035 : -0.035) * s + (r() - 0.5) * 0.1;
      width *= 0.985;
      if (r() < 0.07) {  // branch
        let bx = px, by = py, ba = a + (r() < 0.5 ? -0.7 : 0.7), bw = width * 0.6;
        for (let j = 0; j < 25; j++) {
          const qx = bx + 12 * Math.cos(ba), qy = by + 12 * Math.sin(ba);
          x.lineWidth = Math.max(1, bw);
          x.beginPath(); x.moveTo(bx, by); x.lineTo(qx, qy); x.stroke();
          bx = qx; by = qy; ba += (r() - 0.5) * 0.24; bw *= 0.97;
        }
      }
    }
  }
  const dr = 0.09 * R;
  x.fillStyle = "#f3c58a"; x.beginPath(); x.ellipse(disc[0], disc[1], dr, dr * 1.1, 0, 0, 2 * Math.PI); x.fill();
  x.fillStyle = "#ffeccb"; x.beginPath(); x.ellipse(disc[0] + s * dr * 0.1, disc[1], dr * 0.45, dr * 0.5, 0, 0, 2 * Math.PI); x.fill();
  if (lesions) {
    for (let i = 0; i < 46; i++) {  // hard exudates around the macula
      const ex = mx + (r() + r() - 1) * 0.3 * R, ey = my + (r() + r() - 1) * 0.24 * R, sz = 3 + r() * 5;
      x.fillStyle = "#ecc85c"; x.beginPath(); x.arc(ex, ey, sz, 0, 2 * Math.PI); x.fill();
    }
    for (let i = 0; i < 9; i++) {  // dot-blot haemorrhages
      const hx = cx + (r() - 0.5) * R, hy = cy + (r() - 0.5) * R, sz = 6 + r() * 9;
      x.fillStyle = "#5a0b07"; x.beginPath(); x.arc(hx, hy, sz, 0, 2 * Math.PI); x.fill();
    }
  }
  x.restore();
  return c;
}

function angiogram(src) {  // FAG-like: vessels bright on a dark fundus
  const c = canvas(src.width, src.height), x = c.getContext("2d");
  x.drawImage(src, 0, 0);
  const im = x.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const inside = d[i] + d[i + 1] + d[i + 2] > 30;
    const v = inside ? Math.min(255, Math.max(0, (95 - d[i + 1]) * 3.2 + 55)) : 0;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  x.putImageData(im, 0, 0);
  return c;
}

function octScan(seed, w = 1024, h = 496) {
  const c = canvas(w, h), x = c.getContext("2d"), r = rng(seed);
  const im = x.createImageData(w, h), d = im.data;
  const bands = [[0, 6, 230], [25, 30, 120], [70, 20, 165], [110, 10, 90], [150, 8, 250], [165, 14, 200]];
  for (let col = 0; col < w; col++) {
    const pit = Math.exp(-(((col - w / 2) / 90) ** 2));
    const top = 150 + 20 * Math.sin(col / w * Math.PI) + 60 * pit;
    for (let row = 0; row < h; row++) {
      let v = 0;
      for (const [off, th, val] of bands) if (Math.abs(row - (top + off * (1 - 0.6 * pit))) < th) v += val;
      v += (r() - 0.5) * 70;
      const i = (row * w + col) * 4;
      d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, v)); d[i + 3] = 255;
    }
  }
  x.putImageData(im, 0, 0);
  return c;
}

const toBlobUrl = (c, type = "image/jpeg") =>
  new Promise((res) => c.toBlob((b) => res(URL.createObjectURL(b)), type, 0.92));
async function thumbOf(c) {
  const s = Math.min(1, 360 / Math.max(c.width, c.height));
  const t = canvas(Math.round(c.width * s), Math.round(c.height * s));
  t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
  return toBlobUrl(t);
}

/* ---- gallery ------------------------------------------------------------ */
const MOD = { fundus: "안저 (Color fundus)", fag: "형광안저조영 (FAG)", oct: "OCT", redfree: "Red-free" };
const P1 = { patient: "홍길동 (예시)", mrn: "100234" }, P2 = { patient: "김영희 (예시)", mrn: "100871" };
const SPECS = [
  { ...P1, eye: "OD", modality: "fundus", taken: "2026-10-29 09:12", make: () => fundus({ eye: "OD", seed: 3, lesions: true }) },
  { ...P1, eye: "OS", modality: "fundus", taken: "2026-10-29 09:13", make: () => fundus({ eye: "OS", seed: 4, lesions: true }) },
  { ...P1, eye: "OD", modality: "fag", taken: "2026-10-29 09:30", make: () => angiogram(fundus({ eye: "OD", seed: 3, lesions: true })) },
  { ...P1, eye: "OD", modality: "oct", taken: "2026-10-29 09:40", make: () => octScan(5), png: true },
  { ...P1, eye: "OD", modality: "fundus", taken: "2025-04-15 14:02", make: () => fundus({ eye: "OD", seed: 3 }) },
  { ...P1, eye: "OS", modality: "fundus", taken: "2025-04-15 14:03", make: () => fundus({ eye: "OS", seed: 4 }) },
  { ...P2, eye: "OS", modality: "fundus", taken: "2026-10-20 11:00", make: () => fundus({ eye: "OS", seed: 9 }) },
];

let photos = [], filter = "", anchor = null, viewer = null, nextId = 1;
const selected = new Set();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shown = () => photos.filter((p) => !filter || p.modality === filter);

function render() {
  const list = shown();
  $("count").textContent = `${list.length}장`;
  const groups = [];
  for (const p of list) {
    const day = p.taken.slice(0, 10);
    if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, items: [] });
    groups[groups.length - 1].items.push(p);
  }
  $("groups").innerHTML = groups.map((g) => `
    <section class="group">
      <h2>${g.day} <span>${g.items.length}장</span>
        <button class="btn" type="button" data-day="${g.day}">이 날짜 선택</button></h2>
      <div class="grid">${g.items.map((p) => `
        <div class="card${selected.has(p.id) ? " is-sel" : ""}" data-id="${p.id}" tabindex="0" role="checkbox"
             aria-checked="${selected.has(p.id)}">
          <div class="img"><img src="${p.thumb}" alt="${esc(MOD[p.modality])} ${p.eye}">
            <span class="check" aria-hidden="true">✓</span><span class="eye ${p.eye}">${p.eye}</span>
            ${p.edited ? `<span class="edited">편집본</span>` : ""}</div>
          <div class="cap"><b>${esc(p.patient)}</b> <span class="muted">#${p.mrn}</span><br>
            <span class="tag">${esc(MOD[p.modality])}</span> <span class="muted">${p.taken.slice(11)}</span></div>
        </div>`).join("")}</div>
    </section>`).join("");
  $("selcount").textContent = `${selected.size}장 선택`;
  $("multi").disabled = !selected.size;
}

function toggle(id, shift) {
  const ids = shown().map((p) => p.id);
  if (shift && anchor != null && ids.includes(anchor)) {
    const a = ids.indexOf(anchor), b = ids.indexOf(id);
    ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach((x) => selected.add(x));
  } else {
    selected.has(id) ? selected.delete(id) : selected.add(id);
    anchor = id;
  }
  render();
}

function toViewer(p) {
  return {
    id: p.id, src: p.src, thumb: p.thumb, title: `${p.modality}_${p.eye}_${p.id}`,
    label: [p.patient, p.eye, MOD[p.modality], p.taken.slice(0, 10)].join(" · "),
    short: `${p.eye} ${p.taken.slice(0, 10)}`, contentType: p.png ? "image/png" : "image/jpeg",
    info: [["환자", `${p.patient} (#${p.mrn})`], ["눈", p.eye], ["검사", MOD[p.modality]],
      ["촬영일", p.taken], ...(p.note ? [["메모", p.note]] : [])],
    raw: p,
  };
}

function openViewer(ids) {
  const list = photos.filter((p) => ids.includes(p.id));
  $("gallery-view").hidden = true;
  $("viewer-view").hidden = false;
  $("wrap").classList.add("is-viewer");
  $("viewer-title").textContent = `${list.length}장 · ${[...new Set(list.map((p) => p.patient))].join(", ")}`;
  if (viewer) viewer.destroy();
  viewer = new PhotoViewer($("viewer"), {
    photos: list.map(toViewer),
    download: window.self === window.top,  // framed hosts block file downloads
    // Keep the edited image as a new photo next to the original.
    onSaveEdited: async (photo, blob, meta) => {
      const src = photo.raw, url = URL.createObjectURL(blob);
      const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = url; });
      const c = canvas(img.naturalWidth, img.naturalHeight);
      c.getContext("2d").drawImage(img, 0, 0);
      const p = { ...src, id: nextId++, src: url, thumb: await thumbOf(c), edited: true,
        note: `편집본 (원본 #${src.id}): ${meta.summary}`, png: blob.type === "image/png" };
      photos.unshift(p);
      return toViewer(p);
    },
  });
  window.scrollTo(0, 0);
}

$("back").addEventListener("click", () => {
  if (viewer) { viewer.destroy(); viewer = null; }
  $("viewer-view").hidden = true;
  $("gallery-view").hidden = false;
  $("wrap").classList.remove("is-viewer");
  render();
});
$("groups").addEventListener("click", (e) => {
  const day = e.target.closest("[data-day]");
  if (day) {
    const items = shown().filter((p) => p.taken.startsWith(day.dataset.day));
    const all = items.every((p) => selected.has(p.id));
    items.forEach((p) => all ? selected.delete(p.id) : selected.add(p.id));
    render();
    return;
  }
  const c = e.target.closest(".card");
  if (c) toggle(+c.dataset.id, e.shiftKey);
});
$("groups").addEventListener("dblclick", (e) => {
  const c = e.target.closest(".card");
  if (c) openViewer([+c.dataset.id]);
});
$("groups").addEventListener("keydown", (e) => {
  const c = e.target.closest(".card");
  if (!c || e.target !== c) return;
  if (e.key === " ") { e.preventDefault(); toggle(+c.dataset.id, e.shiftKey); }
  if (e.key === "Enter") openViewer([+c.dataset.id]);
});
$("sel-all").addEventListener("click", () => { shown().forEach((p) => selected.add(p.id)); render(); });
$("sel-none").addEventListener("click", () => { selected.clear(); render(); });
$("multi").addEventListener("click", () => openViewer([...selected]));
$("chips").innerHTML = [["", "모든 검사"], ...Object.entries(MOD).filter(([k]) => k !== "redfree")]
  .map(([k, l]) => `<button class="chip" type="button" data-mod="${k}" aria-pressed="${k === filter}">${l}</button>`).join("");
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mod]");
  if (!b) return;
  filter = b.dataset.mod;
  $("chips").querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

(async function build() {
  for (const spec of SPECS) {
    const c = spec.make();
    const p = { ...spec, id: nextId++, src: await toBlobUrl(c, spec.png ? "image/png" : "image/jpeg"),
      thumb: await thumbOf(c) };
    photos.push(p);
    photos.sort((a, b) => b.taken.localeCompare(a.taken));
    // Start with this visit's colour photos of both eyes selected.
    if (p.taken.startsWith("2026-10-29") && p.modality === "fundus") selected.add(p.id);
    render();
    await new Promise((r) => setTimeout(r));  // let each thumbnail paint
  }
})();
</script>
