<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · ERG/VEP</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="login-brand">👁 ERG / VEP <span>ISCEV</span></div>
    <h1>로그인</h1>
    <p class="muted">안과 전기생리 검사 시스템</p>
    <input type="hidden" name="next" value="{{ next }}">
    <label>아이디<input name="username" autocomplete="username" autofocus required></label>
    <label>비밀번호
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    {% if error %}<p class="msg err">{{ error }}</p>{% endif %}
    <button class="btn primary" type="submit">로그인</button>
    <p class="login-hint muted">최초 관리자 계정: <code>admin</code> · 로그인 후 비밀번호를 변경하세요.</p>
  </form>
</body>
</html>
