{% extends "base.html" %}
{% block title %}Report · ERG/VEP{% endblock %}
{% block content %}
<div class="row-between no-print">
  <a class="back" href="/patients/{{ patient_id }}">← 환자 기록</a>
  <button class="btn" onclick="window.print()">🖨 Print</button>
</div>

<div id="report-head"></div>
<div id="waveforms"></div>

<script>
const EXAM_ID = {{ exam_id }};

(async function () {
  const exam = await api(`/api/exams/${EXAM_ID}`);
  let p = {};
  try { p = await api(`/api/patients/${exam.patient_id}`); } catch (e) {}
  let proto = {};
  try { proto = await api(`/api/protocols/${exam.protocol}`); } catch (e) {}
  let v = null;  // the reception: the day's acuity, pupils and recording conditions
  if (exam.visit_id) { try { v = await api(`/api/visits/${exam.visit_id}`); } catch (e) {} }
  const ageSex = [p.age != null ? p.age + "y" : null,
    ({M:"M",F:"F",O:"O"}[p.sex] || null)].filter(Boolean).join(" ");
  // ISCEV reports should document the patient state at the time of the test.
  const eyeLine = (label, va, ref, pupil) => {
    const parts = [];
    if (va) parts.push("VA " + va);
    if (ref) parts.push(ref);
    if (pupil) parts.push("pupil " + pupil);
    return parts.length ? `<div><b>${label}:</b> ${parts.join(" · ")}</div>` : "";
  };
  const mm = (x) => x != null && x !== "" ? x + " mm" : null;
  const clinical = v
    ? eyeLine("OD", v.va_od, null, mm(v.pupil_od)) + eyeLine("OS", v.va_os, null, mm(v.pupil_os))
    : eyeLine("OD", p.va_od, p.refraction_od, p.pupil_od)
      + eyeLine("OS", p.va_os, p.refraction_os, p.pupil_os);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const cond = v ? [
    v.dark_adapt_min != null ? `dark adaptation ${v.dark_adapt_min} min` : null,
    v.light_adapt_min != null ? `light adaptation ${v.light_adapt_min} min` : null,
    v.electrode ? `electrode ${esc(v.electrode)}` : null,
    v.refraction ? `correction ${esc(v.refraction)}` : null,
  ].filter(Boolean).join(" · ") : "";
  const visitLines = v ? `
      <div><b>Physician:</b> ${esc(v.attending_doctor || "-")}</div>
      <div><b>Diagnosis / indication:</b> ${esc(v.diagnosis || "-")}</div>
      ${cond ? `<div style="grid-column:1/-1"><b>Conditions:</b> ${cond}</div>` : ""}
      ${v.note ? `<div style="grid-column:1/-1"><b>Note:</b> ${esc(v.note)}</div>` : ""}` : "";
  document.getElementById("report-head").innerHTML = `
    <h1>${exam.test_type} report</h1>
    <div class="report-meta card">
      <div><b>Patient:</b> ${p.name || "-"} (#${p.mrn || exam.patient_id})${ageSex ? " · " + ageSex : ""}</div>
      <div><b>Protocol:</b> ${proto.label || exam.protocol}</div>
      <div><b>Standard:</b> ${proto.standard || "—"}</div>
      <div><b>Performed:</b> ${fmtDateTime(exam.performed_at)}</div>
      <div><b>Device:</b> ${exam.device || "-"}</div>
      <div><b>Operator:</b> ${exam.operator || "-"}</div>
      ${visitLines}
      ${clinical}
    </div>`;
  renderExam(exam, document.getElementById("waveforms"));
})();
</script>
{% endblock %}
