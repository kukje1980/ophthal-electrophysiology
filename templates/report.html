{% extends "base.html" %}
{% block title %}리포트 · ERG·VEP{% endblock %}
{% block content %}
<div class="row-between no-print" style="margin-bottom:16px">
  <a class="back" href="/patients/{{ patient_id }}" style="margin:0"><svg class="ico"><use href="#i-back"/></svg>환자 기록</a>
  <div class="btn-row">
    <a class="btn" id="csv-link" href="/api/exams/{{ exam_id }}/export.csv"><svg class="ico"><use href="#i-download"/></svg>CSV</a>
    <button class="btn primary" onclick="window.print()"><svg class="ico"><use href="#i-print"/></svg>인쇄 / PDF</button>
  </div>
</div>

<article class="card report-sheet">
  <header class="report-band">
    <span class="brand">
      {% include "partials/mark.html" %}
      <span class="brand-text">
        <span class="brand-name">ERG<b>·</b>VEP</span>
        <span class="brand-sub">Visual Electrophysiology</span>
      </span>
    </span>
    <div class="report-title">
      <h1 id="report-h1">Electrophysiology report</h1>
      <p id="report-id">Exam #{{ exam_id }}</p>
      <div id="report-status"></div>
    </div>
  </header>
  <dl class="report-meta" id="report-meta"></dl>
  <div class="report-clin" id="report-clin"></div>
</article>

<div id="analysis"></div>
<div id="waveforms"></div>
<div id="interpretation"></div>

<script>
const EXAM_ID = {{ exam_id }};
const PERMS = {{ perms | tojson }};
const can = (p) => PERMS.includes(p);
let exam = null, analysis = null, patient = {}, proto = {}, visit = null, knownMarkers = [];

// server times are naive UTC: fmtDateTime shows them in local time
const fmtDate = (s) => s ? fmtDateTime(s) : "—";

function renderHead() {
  const p = patient, v = visit;
  const sex = ({M: "남 M", F: "여 F", O: "기타 O"})[p.sex];
  const ageSex = [sex, p.age != null ? p.age + "세" : null].filter(Boolean).join(" · ");
  const item = (k, val, mono, cls) =>
    `<div${cls ? ` class="${cls}"` : ""}><dt>${k}</dt><dd${mono ? ' class="mono"' : ""}>${esc(val == null || val === "" ? "—" : val)}</dd></div>`;

  document.getElementById("report-h1").textContent = `${exam.test_type} Report`;
  document.getElementById("report-id").textContent =
    `Exam #${exam.id} · ${proto.standard || exam.protocol}`;
  document.getElementById("report-status").innerHTML = exam.status === "signed"
    ? `<span class="status-pill signed small" title="${fmtDate(exam.signed_at)}">✔ 서명 완료 · ${esc(exam.signed_by)}</span>`
    : `<span class="status-pill open small no-print">판독 대기 (미서명)</span>`;
  // the reception carries the day's physician, diagnosis and recording conditions
  const cond = v ? [
    v.dark_adapt_min != null ? `암순응 ${v.dark_adapt_min}분` : null,
    v.light_adapt_min != null ? `명순응 ${v.light_adapt_min}분` : null,
    v.electrode ? `전극 ${v.electrode}` : null,
    v.refraction ? `굴절교정 ${v.refraction}` : null,
  ].filter(Boolean).join(" · ") : "";
  document.getElementById("report-meta").innerHTML = [
    item("환자 Patient", p.name),
    item("등록번호 MRN", p.mrn || exam.patient_id, true),
    item("성별 · 나이", ageSex),
    item("생년월일 DOB", p.birth_date, true),
    item("검사 Test", exam.test_type),
    item("프로토콜 Protocol", proto.label || exam.protocol),
    item("표준 Standard", proto.standard),
    item("검사 일시 Performed", fmtDate(exam.performed_at), true),
    item("장비 Device", exam.device, true),
    item("검사자 Operator", exam.operator),
    v ? item("담당의 Physician", v.attending_doctor) : item("의뢰의 Referring", p.referring_doctor),
    v ? item("진단 · 사유 Indication", v.diagnosis) : item("주호소 C.C.", p.chief_complaint),
    cond ? item("검사 조건 Conditions", cond, false, "span2") : "",
    exam.note ? item("메모 Note", exam.note, false, "span2") : "",
    v && v.note ? item("접수 메모", v.note, false, "span2") : "",
  ].join("");

  // ISCEV reports should document the patient state at the time of the test:
  // the visit's acuity / pupils when the exam was recorded under a reception.
  const mm = (x) => x != null && x !== "" ? x + " mm" : null;
  const eyeLine = (eye, va, ref, pupil) => {
    const parts = [];
    if (va) parts.push("VA " + va);
    if (ref) parts.push(ref);
    if (pupil) parts.push("pupil " + pupil);
    return parts.length
      ? `<div><span class="eye-chip ${eye.toLowerCase()}">${eye}</span>
           <span class="mono">${esc(parts.join(" · "))}</span></div>` : "";
  };
  const clinical = v
    ? eyeLine("OD", v.va_od, null, mm(v.pupil_od)) + eyeLine("OS", v.va_os, null, mm(v.pupil_os))
    : eyeLine("OD", p.va_od, p.refraction_od, p.pupil_od)
      + eyeLine("OS", p.va_os, p.refraction_os, p.pupil_os);
  const clinEl = document.getElementById("report-clin");
  clinEl.innerHTML = clinical;
  clinEl.hidden = !clinical;
}

function renderAnalysis() {
  if (!analysis) return;
  const a = analysis;
  const counts = `<span class="badge flag-abn">비정상 ${a.abnormal.length}</span>
    <span class="badge flag-bord">경계 ${a.borderline.length}</span>
    <span class="badge ${a.asymmetry.length ? "flag-bord" : "flag-norm"}">양안차 ${a.asymmetry.length}</span>`;
  document.getElementById("analysis").innerHTML = `
    <section class="card analysis-card ${a.overall}">
      <div class="row-between">
        <h3>자동 분석 요약 ${flagBadge(a.overall)}</h3>
        <span class="legend">${counts}</span>
      </div>
      <ul class="summary-list">${a.summary.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
      <p class="muted cap">자동 검출/분류 결과입니다. 최종 판단은 판독의가 커서를 확인한 뒤 아래 소견란에 기록합니다.</p>
    </section>`;
}

function renderInterpretation() {
  const signed = exam.status === "signed";
  const canEdit = can("interpret_exam") && !signed;
  const el = document.getElementById("interpretation");
  const signBlock = signed ? `
      <div class="sign-stamp">
        <div><b>판독의 서명:</b> ${esc(exam.signed_by)} · ${fmtDate(exam.signed_at)}</div>
        ${exam.interpreted_by ? `<div class="muted">소견 작성: ${esc(exam.interpreted_by)} · ${fmtDate(exam.interpreted_at)}</div>` : ""}
        ${can("sign_report") ? `<button class="btn small no-print" id="reopen-btn">🔓 서명 해제 (수정)</button>` : ""}
      </div>` : `
      <div class="sign-row no-print">
        ${exam.interpreted_by ? `<span class="muted">소견 저장: ${esc(exam.interpreted_by)} · ${fmtDate(exam.interpreted_at)}</span>` : `<span class="muted">아직 저장된 소견이 없습니다.</span>`}
        ${can("sign_report") ? `<button class="btn primary" id="sign-btn">✍ 서명 (리포트 확정)</button>` : ""}
      </div>`;

  el.innerHTML = `
    <section class="card interp-card">
      <div class="row-between">
        <h3>판독 소견 (Interpretation)</h3>
        ${canEdit ? `<div class="toolbar no-print">
            <button class="btn small" id="suggest-btn" title="자동 분석 요약을 소견란에 붙여 넣기">↙ 요약 가져오기</button>
            <button class="btn small primary" id="save-interp">저장</button>
          </div>` : ""}
      </div>
      <label class="field-block">소견 (Findings)
        ${canEdit
          ? `<textarea id="interp-text" rows="7" placeholder="각 검사 단계별 파형의 소견을 기록합니다.">${esc(exam.interpretation || "")}</textarea>`
          : `<div class="ro-text">${esc(exam.interpretation || "—").replace(/\n/g, "<br>")}</div>`}
      </label>
      <label class="field-block">결론 (Impression)
        ${canEdit
          ? `<input id="impression-text" maxlength="512" value="${esc(exam.impression || "")}" placeholder="예: 양안 정상 패턴 VEP / 좌안 P100 잠복기 지연 — 시신경 전도 이상 시사">`
          : `<div class="ro-text impression">${esc(exam.impression || "—")}</div>`}
      </label>
      <p id="interp-msg" class="msg"></p>
      ${signBlock}
    </section>`;

  const saveBtn = document.getElementById("save-interp");
  if (saveBtn) saveBtn.onclick = async () => {
    try {
      exam = await api(`/api/exams/${EXAM_ID}/interpretation`, { method: "PUT", body: {
        interpretation: document.getElementById("interp-text").value || null,
        impression: document.getElementById("impression-text").value || null,
      }});
      renderInterpretation();
      setMsg("interp-msg", "소견이 저장되었습니다.", "ok");
    } catch (e) { setMsg("interp-msg", e.message, "err"); }
  };
  const suggest = document.getElementById("suggest-btn");
  if (suggest) suggest.onclick = () => {
    const ta = document.getElementById("interp-text");
    const lines = (analysis ? analysis.summary : []).join("\n");
    ta.value = (ta.value ? ta.value.replace(/\s+$/, "") + "\n" : "") + lines;
    ta.focus();
  };
  const signBtn = document.getElementById("sign-btn");
  if (signBtn) signBtn.onclick = async () => {
    const ta = document.getElementById("interp-text");
    const imp = document.getElementById("impression-text");
    if (ta && imp && (ta.value !== (exam.interpretation || "") || imp.value !== (exam.impression || ""))) {
      if (!confirm("저장되지 않은 소견이 있습니다. 먼저 저장한 뒤 서명할까요?")) return;
      await document.getElementById("save-interp").onclick();
    }
    if (!confirm("서명하면 커서·소견이 잠기고 리포트가 확정됩니다. 계속할까요?")) return;
    try { exam = await api(`/api/exams/${EXAM_ID}/sign`, { method: "POST" }); await reload(false); }
    catch (e) { setMsg("interp-msg", e.message, "err"); }
  };
  const reopenBtn = document.getElementById("reopen-btn");
  if (reopenBtn) reopenBtn.onclick = async () => {
    if (!confirm("서명을 해제하고 리포트를 다시 수정 가능 상태로 되돌릴까요? (감사 로그에 기록됩니다)")) return;
    try { exam = await api(`/api/exams/${EXAM_ID}/reopen`, { method: "POST" }); await reload(false); }
    catch (e) { setMsg("interp-msg", e.message, "err"); }
  };
}

function renderAll() {
  renderHead();
  renderAnalysis();
  renderExam(exam, document.getElementById("waveforms"), {
    stepLabels: Object.fromEntries((proto.steps || []).map((s) => [s.key, s.label])),
    editable: can("edit_markers") && exam.status !== "signed",
    analysis, markers: knownMarkers,
    onChange: () => reload(true),
  });
  renderInterpretation();
}

async function reload(keepScroll) {
  const y = window.scrollY;
  [exam, analysis] = await Promise.all([
    api(`/api/exams/${EXAM_ID}`), api(`/api/exams/${EXAM_ID}/analysis`).catch(() => null),
  ]);
  renderAll();
  if (keepScroll) window.scrollTo(0, y);
}

(async function () {
  exam = await api(`/api/exams/${EXAM_ID}`);
  const [p, pr, an, mk, v] = await Promise.all([
    api(`/api/patients/${exam.patient_id}`).catch(() => ({})),
    api(`/api/protocols/${exam.protocol}`).catch(() => ({})),
    api(`/api/exams/${EXAM_ID}/analysis`).catch(() => null),
    api(`/api/markers`).catch(() => ({ markers: [] })),
    exam.visit_id ? api(`/api/visits/${exam.visit_id}`).catch(() => null) : null,
  ]);
  patient = p; proto = pr; analysis = an; knownMarkers = mk.markers || []; visit = v;
  renderAll();
})();
</script>
{% endblock %}
