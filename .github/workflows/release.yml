name: release

# Every push runs the tests, builds the Windows bundle and a source zip, and
# publishes them as the GitHub release "latest" (fixed download address, no
# login needed). Pull requests only build. A version tag (v1.2.3) additionally
# creates a permanent release for that version.
#
#   https://github.com/<owner>/<repo>/releases/download/latest/OphthalElectrophysiology-windows.zip
#   https://github.com/<owner>/<repo>/releases/download/latest/ophthal-electrophysiology-source.zip

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

# a newer build replaces the published download of an older one
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # publish the zips as a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/oep.spec --noconfirm

      - name: Smoke test the packaged build
        shell: bash
        run: |
          cd dist/OphthalElectrophysiology
          ./OphthalElectrophysiology.exe --no-browser &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login | grep -q '^200$'; then
              echo "server answered after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          kill %1 || true
          test "${ok:-0}" = 1
          # the smoke test must not ship its database or logs
          rm -rf ophthal_electrophysiology.db* data backups logs

      - name: Zip the build and the source
        shell: bash
        run: |
          (cd dist && 7z a -tzip ../OphthalElectrophysiology-windows.zip OphthalElectrophysiology > /dev/null)
          git archive --format=zip --prefix=ophthal-electrophysiology/ \
            -o ophthal-electrophysiology-source.zip HEAD
          sha256sum OphthalElectrophysiology-windows.zip ophthal-electrophysiology-source.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OphthalElectrophysiology-windows
          path: |
            OphthalElectrophysiology-windows.zip
            ophthal-electrophysiology-source.zip
            SHA256SUMS.txt

      - name: Publish as release "latest"
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c "import app; print(app.__version__)")
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            OphthalElectrophysiology-windows.zip ophthal-electrophysiology-source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "안과 전기생리 검사 시스템 — 최신판 (v$VERSION, $(date -u +%Y-%m-%d))" \
            --notes-file packaging/release_notes.md

      - name: Publish the version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            OphthalElectrophysiology-windows.zip ophthal-electrophysiology-source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "안과 전기생리 검사 시스템 $TAG" \
            --notes-file packaging/release_notes.md --generate-notes
