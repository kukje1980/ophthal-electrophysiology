name: release

# Every push runs the tests, builds the Windows bundle and a source zip, and
# publishes them as the GitHub release "latest" (fixed download address, no
# login needed). Pull requests only build. Each version also gets a permanent
# release v<app.__version__>, created by the first push that carries it (the
# sessions that push here cannot push tags) or by a v1.2.3 tag push.
#
#   https://github.com/<owner>/<repo>/releases/download/latest/OphthalElectrophysiology-windows.zip
#   https://github.com/<owner>/<repo>/releases/download/latest/ophthal-electrophysiology-source.zip

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

# a newer build replaces the published download of an older one
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # publish the zips as a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/oep.spec --noconfirm

      - name: Smoke test the packaged build
        shell: bash
        # Data goes to a scratch folder so nothing of the test ships in the zip.
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/smoke/smoke.db
          LOG_DIR: ${{ runner.temp }}/smoke/logs
          PHOTO_DIR: ${{ runner.temp }}/smoke/photos
          BACKUP_DIR: ${{ runner.temp }}/smoke/backups
          BACKUP_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd dist/OphthalElectrophysiology
          ./OphthalElectrophysiology.exe --no-browser &
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login | grep -q '^200$'; then
              echo "server answered after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          taskkill //F //IM OphthalElectrophysiology.exe || true
          test "${ok:-0}" = 1
          # nothing but the build may be in the folder we zip
          ls -A | grep -vE '^(OphthalElectrophysiology\.exe|_internal)$' && exit 1 || true

      - name: Zip the build and the source
        shell: bash
        run: |
          (cd dist && 7z a -tzip ../OphthalElectrophysiology-windows.zip OphthalElectrophysiology > /dev/null)
          git archive --format=zip --prefix=ophthal-electrophysiology/ \
            -o ophthal-electrophysiology-source.zip HEAD
          sha256sum OphthalElectrophysiology-windows.zip ophthal-electrophysiology-source.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OphthalElectrophysiology-windows
          path: |
            OphthalElectrophysiology-windows.zip
            ophthal-electrophysiology-source.zip
            SHA256SUMS.txt

      - name: Publish as release "latest"
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c "import app; print(app.__version__)")
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            OphthalElectrophysiology-windows.zip ophthal-electrophysiology-source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "안과 전기생리 검사 시스템 — 최신판 (v$VERSION, $(date -u +%Y-%m-%d))" \
            --notes-file packaging/release_notes.md

      - name: Publish the version release (once per version)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c "import app; print(app.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$VERSION"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists - nothing to do"; exit 0
          fi
          # install notes + this version's section of CHANGELOG.md
          {
            cat packaging/release_notes.md
            echo; echo "### 이번 버전 변경 사항 / Changes in $TAG"; echo
            awk -v v="## $TAG" 'index($0, v) == 1 {on = 1; next} on && /^## v/ {exit} on' CHANGELOG.md
          } > version_notes.md
          gh release create "$TAG" \
            OphthalElectrophysiology-windows.zip ophthal-electrophysiology-source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "안과 전기생리 검사 시스템 $TAG" \
            --notes-file version_notes.md
