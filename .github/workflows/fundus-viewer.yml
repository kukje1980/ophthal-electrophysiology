name: fundus-viewer

on:
  push:
    paths: ["fundus_viewer/**", ".github/workflows/fundus-viewer.yml"]
  pull_request:
    paths: ["fundus_viewer/**", ".github/workflows/fundus-viewer.yml"]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fundus_viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # publish the zip as a release (download without logging in)
    defaults:
      run:
        working-directory: fundus_viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller fundus_viewer.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: FundusViewer-windows
          path: fundus_viewer/dist/FundusViewer
      # Fixed download address for the newest build:
      # https://github.com/<owner>/<repo>/releases/download/fundus-viewer-latest/FundusViewer-windows.zip
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && 7z a -tzip ../FundusViewer-windows.zip FundusViewer > /dev/null)
          gh release delete fundus-viewer-latest --yes --cleanup-tag || true
          gh release create fundus-viewer-latest FundusViewer-windows.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "FundusViewer - latest Windows build" \
            --notes "Windows 10/11 build of commit $GITHUB_SHA ($GITHUB_REF_NAME). Unzip and run FundusViewer\\FundusViewer.exe."
